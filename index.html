<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at center, #ff477e 0%, #b51750 35%, #3b0624 100%);
    color: white;
}

/* Soft glowing background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.12), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,120,180,.15), transparent 30%);
    animation: glow 5s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        opacity: .5;
    }
    to {
        opacity: 1;
    }
}

/* Falling hearts container */
#hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

/* Individual hearts */
.heart {
    position: absolute;
    top: -80px;
    color: #ffb3cc;
    user-select: none;
    animation: fall linear forwards;
    filter: drop-shadow(0 0 8px rgba(255, 150, 200, .8));
}

@keyframes fall {

    0% {
        transform:
            translateY(-80px)
            translateX(0)
            rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .9;
    }

    50% {
        transform:
            translateY(55vh)
            translateX(40px)
            rotate(180deg);
    }

    100% {
        transform:
            translateY(115vh)
            translateX(-40px)
            rotate(360deg);
        opacity: 0;
    }
}

/* Main content */
.container {
    position: relative;
    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

/* Opening text */
.intro {
    position: absolute;

    font-size: clamp(25px, 4vw, 45px);

    opacity: 0;

    animation: intro 3s ease forwards;
}

@keyframes intro {

    0% {
        opacity: 0;
        transform: translateY(20px);
    }

    30% {
        opacity: 1;
        transform: translateY(0);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-20px);
    }
}

/* Main message */
.main {
    opacity: 0;
    animation: reveal 2s ease forwards;
    animation-delay: 3s;
}

@keyframes reveal {

    from {
        opacity: 0;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.title {
    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(55px, 10vw, 140px);

    font-weight: bold;

    letter-spacing: 2px;

    text-shadow:
        0 0 10px rgba(255,255,255,.9),
        0 0 25px #ff5c9a,
        0 0 50px #ff2f78,
        0 0 90px #ff2f78;

    animation: heartbeat 2s ease-in-out infinite;
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

/* Big heart */
.big-heart {
    margin-top: 25px;

    font-size: clamp(60px, 9vw, 120px);

    animation:
        heartBeat 1.4s ease-in-out infinite;

    filter:
        drop-shadow(0 0 10px #fff)
        drop-shadow(0 0 25px #ff5c9a)
        drop-shadow(0 0 50px #ff2f78);
}

@keyframes heartBeat {

    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.18);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.12);
    }

    60% {
        transform: scale(1);
    }
}

/* Small message underneath */
.subtitle {
    margin-top: 20px;

    font-size: clamp(18px, 3vw, 30px);

    font-style: italic;

    opacity: .9;

    text-shadow: 0 0 15px rgba(255,255,255,.5);
}

/* Small hint */
.hint {
    position: fixed;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    color: rgba(255,255,255,.35);

    font-family: Arial, sans-serif;

    font-size: 12px;
}

/* Mobile adjustment */
@media (max-width: 600px) {

    .title {
        font-size: 58px;
    }

    .subtitle {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<div id="hearts"></div>

<div class="container">

    <!-- Opening message -->
    <div class="intro">
        Hey...
    </div>

    <!-- Main message -->
    <div class="main">

        <div class="title">
            I Love You, Bueno!
        </div>

        <div class="big-heart">
            ❤️
        </div>

        <div class="subtitle">
            Just wanted you to know. ❤️
        </div>

    </div>

</div>

<div class="hint">
    Press ESC to close
</div>


<script>

/* --------------------------------
   FALLING HEARTS
-------------------------------- */

const hearts = document.getElementById("hearts");

const heartTypes = [
    "❤️",
    "💕",
    "💗",
    "💖",
    "💓",
    "♥"
];

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    /* Random heart */
    heart.innerHTML =
        heartTypes[
            Math.floor(Math.random() * heartTypes.length)
        ];

    /* Random horizontal position */
    heart.style.left =
        Math.random() * 100 + "vw";

    /* Random size */
    const size =
        18 + Math.random() * 42;

    heart.style.fontSize =
        size + "px";

    /* Random speed */
    const duration =
        5 + Math.random() * 8;

    heart.style.animationDuration =
        duration + "s";

    /* Random opacity */
    heart.style.opacity =
        .4 + Math.random() * .6;

    /* Slight random horizontal movement */
    heart.style.marginLeft =
        (Math.random() * 80 - 40) + "px";

    hearts.appendChild(heart);

    /* Remove old heart */
    setTimeout(function() {

        heart.remove();

    }, (duration + 1) * 1000);
}


/* Start with lots of hearts */

for (let i = 0; i < 35; i++) {

    setTimeout(
        createHeart,
        Math.random() * 4000
    );

}


/* Keep creating hearts */

setInterval(
    createHeart,
    180
);


/* --------------------------------
   ESCAPE TO CLOSE
-------------------------------- */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            window.close();

        }

    }
);

</script>

</body>
</html>
